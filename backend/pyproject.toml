[project]
name = "octopod-backend"
version = "0.1.0"
description = "Roster management API"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "pillow>=10.4",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "sqlalchemy-cloudflare-d1>=0.4.1",
]

[dependency-groups]
dev = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "uvicorn[standard]>=0.30",
    "workers-py",
    "workers-runtime-sdk",
]

# The Worker runtime supplies ``workers``/``workers.asgi`` and the Pyodide
# packages. ``uvicorn``, ``psycopg``, and ``alembic`` are legacy/local-only and
# deliberately not part of the production Worker path.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["python_modules", ".venv-workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "d1: integration tests that require pywrangler dev and a local D1 database",
]
